<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
  <title id="title">Xodus midnight horizon wallpaper</title>
  <desc id="desc">A calm midnight blue desktop. Fine orbital lines and a luminous geometric X gather on the right, leaving the middle and left clear for windows.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="3840" y2="2160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1B2F"/>
      <stop offset=".49" stop-color="#071322"/>
      <stop offset="1" stop-color="#10132D"/>
    </linearGradient>
    <linearGradient id="low-sheen" x1="0" y1="2160" x2="3350" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17415A" stop-opacity=".26"/>
      <stop offset=".5" stop-color="#17415A" stop-opacity="0"/>
      <stop offset="1" stop-color="#514789" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="cyan-atmosphere" cx="3110" cy="990" r="1350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B8AA4" stop-opacity=".23"/>
      <stop offset=".43" stop-color="#145E8D" stop-opacity=".1"/>
      <stop offset="1" stop-color="#145E8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-atmosphere" cx="3480" cy="1690" r="1030" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7350B3" stop-opacity=".2"/>
      <stop offset=".52" stop-color="#6C50B6" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6C50B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-atmosphere" cx="3590" cy="275" r="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DEA66A" stop-opacity=".1"/>
      <stop offset="1" stop-color="#DEA66A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="70" y1="84" x2="442" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75F2EF" stop-opacity=".65"/>
      <stop offset=".43" stop-color="#49B8E9" stop-opacity=".51"/>
      <stop offset="1" stop-color="#AD85F5" stop-opacity=".61"/>
    </linearGradient>
    <linearGradient id="signal-edge" x1="70" y1="84" x2="442" y2="428" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9FFFF" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#9DD8F6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#D5B5FF" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="flight" x1="1900" y1="1050" x2="3840" y2="1050" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60B9D4" stop-opacity="0"/>
      <stop offset=".59" stop-color="#60B9D4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#9A83E3" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="field-fade" x1="1550" y1="0" x2="3800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="black"/>
      <stop offset=".57" stop-color="white" stop-opacity=".45"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="field-mask"><rect width="3840" height="2160" fill="url(#field-fade)"/></mask>
    <pattern id="field" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0H0V160" fill="none" stroke="#9CC6DC" stroke-width="1" opacity=".22"/>
      <circle cx="0" cy="0" r="2" fill="#A0C5D8" opacity=".34"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#night)"/>
  <rect width="3840" height="2160" fill="url(#low-sheen)"/>
  <rect width="3840" height="2160" fill="url(#cyan-atmosphere)"/>
  <rect width="3840" height="2160" fill="url(#violet-atmosphere)"/>
  <rect width="3840" height="2160" fill="url(#amber-atmosphere)"/>

  <g mask="url(#field-mask)">
    <rect x="1450" width="2390" height="2160" fill="url(#field)" opacity=".17"/>
    <g fill="none" stroke="#8AC9DE" stroke-width="2">
      <circle cx="3128" cy="1080" r="456" opacity=".15"/>
      <circle cx="3128" cy="1080" r="710" opacity=".1"/>
      <circle cx="3128" cy="1080" r="951" opacity=".07"/>
    </g>
    <path d="M2160-80C2520 325 2802 676 3095 1079c218 301 441 652 806 1107" fill="none" stroke="url(#flight)" stroke-width="3"/>
    <path d="M1940 2200c503-602 877-913 1157-1121C3385 864 3619 568 3890 110" fill="none" stroke="url(#flight)" stroke-width="2"/>
    <path d="M2050 1735c487 0 832-232 1064-654 247-451 462-604 795-730" fill="none" stroke="#7BD6E9" stroke-width="1.5" opacity=".1"/>
    <path d="M2396 267c200 362 438 629 713 814 284 191 521 423 749 818" fill="none" stroke="#B6A6ED" stroke-width="1.5" opacity=".1"/>
    <circle cx="3128" cy="1080" r="550" fill="none" stroke="#89DDEB" stroke-width="2.5" stroke-dasharray="3 31" opacity=".24"/>
    <path d="M2717 548a710 710 0 0 1 972 812" fill="none" stroke="#8CDDE7" stroke-width="3" opacity=".31"/>
    <path d="M2550 1516a710 710 0 0 0 939 173" fill="none" stroke="#B497EC" stroke-width="2" opacity=".29"/>
    <path d="M3463 172a951 951 0 0 1 615 841" fill="none" stroke="#DDAE82" stroke-width="2" opacity=".16"/>
    <path d="M2170 2131a951 951 0 0 0 772-113" fill="none" stroke="#70BDD3" stroke-width="2" opacity=".14"/>
  </g>

  <g transform="translate(2539 491) scale(2.3)">
    <path fill="url(#signal)" fill-rule="evenodd" d="M70 84h116l70 97 70-97h116L321 250l121 178H326l-70-104-70 104H70l121-178L70 84Zm186 142-22 30 22 30 22-30-22-30Z"/>
    <path fill="none" stroke="url(#signal-edge)" stroke-width="1.3" stroke-linejoin="round" d="M70 84h116l70 97 70-97h116L321 250l121 178H326l-70-104-70 104H70l121-178L70 84Z"/>
  </g>
  <circle cx="3128" cy="1080" r="9" fill="#D6FDFA" opacity=".78"/>
  <circle cx="3128" cy="1080" r="35" fill="none" stroke="#8DE5E8" opacity=".28"/>
  <circle cx="3536" cy="519" r="5" fill="#E9BD82" opacity=".69"/>
  <path d="M3508 519h-30m58 0h30m-30-29v-28m0 56v28" stroke="#E9BD82" stroke-width="1.5" opacity=".24"/>
</svg>
