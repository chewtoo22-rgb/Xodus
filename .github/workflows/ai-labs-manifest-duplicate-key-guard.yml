name: AI Labs Manifest Duplicate-Key Guard

on:
  pull_request:
    paths:
      - 'qa/ai_labs_readiness_contract.py'
      - 'qa/test_ai_labs_readiness_contract.py'
      - 'qa/ai-labs-readiness-manifest.json'
      - '.github/workflows/ai-labs-manifest-duplicate-key-guard.yml'
  push:
    branches: [main]
    paths:
      - 'qa/ai_labs_readiness_contract.py'
      - 'qa/test_ai_labs_readiness_contract.py'
      - 'qa/ai-labs-readiness-manifest.json'
      - '.github/workflows/ai-labs-manifest-duplicate-key-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest
        run: python3 qa/ai_labs_readiness_contract.py
      - name: Run duplicate-key regression
        run: python3 -m unittest qa/test_ai_labs_readiness_contract.py
