name: First Boot Runtime Acceptance

on:
  pull_request:
    paths:
      - 'qa/first-boot-runtime-acceptance.py'
      - 'qa/test_first_boot_runtime_acceptance.py'
      - '.github/workflows/first-boot-runtime-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile qa/first-boot-runtime-acceptance.py qa/test_first_boot_runtime_acceptance.py
      - name: Run regression suite
        run: python qa/test_first_boot_runtime_acceptance.py
      - name: Enforce non-claiming contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('qa/first-boot-runtime-acceptance.py').read_text(encoding='utf-8')
          required = ['"hardware_validation_claim": False', 'X1 first-boot acceptance requires UEFI']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing acceptance safety contract: {missing}')
          forbidden = ['subprocess.', 'os.system(', 'mount(', 'mkfs', 'parted', 'sgdisk', 'systemctl']
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit(f'mutating/destructive primitive found: {found}')
          PY
