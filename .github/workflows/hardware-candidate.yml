name: Hardware Candidate Gate

on:
  workflow_run:
    workflows: ["QA QEMU Boot Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA to verify as a hardware candidate"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_RUN_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            sha="$DISPATCH_SOURCE_SHA"
          else
            sha="$WORKFLOW_RUN_SOURCE_SHA"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid candidate SHA: $sha" >&2
            exit 1
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Verify matching green Core ISO and QA runs
        id: verify
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const {data: mainBranch} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (mainBranch.commit.sha !== sha) {
              core.setFailed(`Candidate ${sha} is not the current main commit ${mainBranch.commit.sha}`);
              return;
            }

            async function findSuccessfulRun(workflowFile, workflowName, allowedEvents) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {owner, repo, workflow_id: workflowFile, per_page: 100}
              );
              const matches = runs.filter(r =>
                r.head_sha === sha &&
                r.head_branch === 'main' &&
                r.head_repository?.full_name === `${owner}/${repo}` &&
                allowedEvents.includes(r.event) &&
                r.status === 'completed' && r.conclusion === 'success'
              );
              if (!matches.length) {
                core.setFailed(`${workflowName} has no successful run for ${sha}`);
                return null;
              }
              return matches.sort((a, b) => b.run_number - a.run_number)[0];
            }

            const coreRun = await findSuccessfulRun('core-iso-build.yml', 'Core ISO Build', ['push', 'workflow_dispatch']);
            const qaRun = await findSuccessfulRun('qa-qemu-smoke.yml', 'QA QEMU Boot Smoke', ['workflow_run', 'workflow_dispatch']);
            if (!coreRun || !qaRun) return;

            const coreArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: coreRun.id, per_page: 100}
            );
            const qaArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: qaRun.id, per_page: 100}
            );

            const isoArtifacts = coreArtifacts.filter(a => /^xodus-reference-iso-[0-9a-f]{40}$/.test(a.name) && !a.expired);
            const qaEvidence = qaArtifacts.filter(a => a.name === `xodus-qemu-smoke-${sha}` && !a.expired);
            if (isoArtifacts.length !== 1 || qaEvidence.length !== 1) {
              core.setFailed(`Expected one live Core ISO artifact and one matching QEMU evidence artifact for ${sha}`);
              return;
            }
            const isoArtifact = isoArtifacts[0];
            core.setOutput('core_run_id', String(coreRun.id));
            core.setOutput('qa_run_id', String(qaRun.id));

            const manifest = {
              schema: 1,
              candidate_sha: sha,
              qualified_at: new Date().toISOString(),
              policy: 'live-boot-only',
              core_iso: {
                run_id: coreRun.id,
                run_number: coreRun.run_number,
                html_url: coreRun.html_url,
                artifact_id: isoArtifact.id,
                artifact_name: isoArtifact.name,
                artifact_size_bytes: isoArtifact.size_in_bytes,
                artifact_digest: isoArtifact.digest || null,
                expires_at: isoArtifact.expires_at || null
              },
              qa_qemu: {
                run_id: qaRun.id,
                run_number: qaRun.run_number,
                html_url: qaRun.html_url,
                artifacts: qaArtifacts.filter(a => !a.expired).map(a => ({
                  id: a.id,
                  name: a.name,
                  size_bytes: a.size_in_bytes,
                  digest: a.digest || null,
                  expires_at: a.expires_at || null
                }))
              }
            };

            require('fs').writeFileSync('hardware-candidate.json', JSON.stringify(manifest, null, 2) + '\n');
            core.summary
              .addHeading('Xodus hardware candidate qualified')
              .addTable([
                [{data: 'Candidate', header: true}, sha],
                [{data: 'Core ISO run', header: true}, String(coreRun.run_number)],
                [{data: 'QA run', header: true}, String(qaRun.run_number)],
                [{data: 'ISO artifact', header: true}, isoArtifact.name],
                [{data: 'Policy', header: true}, manifest.policy]
              ])
              .write();

      - name: Download matching QEMU evidence
        uses: actions/download-artifact@v4
        with:
          name: xodus-qemu-smoke-${{ steps.candidate.outputs.sha }}
          path: qa-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.verify.outputs.qa_run_id }}

      - name: Bind QEMU result to the selected ISO run
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CORE_RUN_ID: ${{ steps.verify.outputs.core_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('qa-evidence/qa-image-digest.txt')
          if not path.is_file() or path.is_symlink():
              raise SystemExit('missing regular QEMU image digest evidence')
          lines = path.read_text(encoding='utf-8').splitlines()
          fields = {}
          for line in lines:
              key, sep, value = line.partition('=')
              if not sep or key in fields:
                  raise SystemExit('malformed or duplicate QEMU digest key')
              fields[key] = value
          if set(fields) != {'sha256', 'core_source_sha', 'core_run_id'}:
              raise SystemExit('QEMU digest schema mismatch')
          if not re.fullmatch(r'[0-9a-f]{64}', fields['sha256']):
              raise SystemExit('invalid QEMU ISO SHA-256')
          if fields['core_source_sha'] != os.environ['CANDIDATE_SHA']:
              raise SystemExit('QEMU source SHA does not match candidate')
          if fields['core_run_id'] != os.environ['CORE_RUN_ID']:
              raise SystemExit('QEMU tested a different Core ISO run')
          print(f"QEMU tested Core ISO run {fields['core_run_id']} at {fields['sha256']}")
          PY

      - name: Upload qualification manifest
        uses: actions/upload-artifact@v4
        with:
          name: hardware-candidate-${{ steps.candidate.outputs.sha }}
          path: hardware-candidate.json
          retention-days: 14
          if-no-files-found: error
