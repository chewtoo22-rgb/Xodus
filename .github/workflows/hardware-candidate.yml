name: Hardware Candidate Gate

on:
  workflow_run:
    workflows: ["QA QEMU Boot Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Commit SHA to verify as a hardware candidate"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  qualify:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve candidate SHA
        id: candidate
        shell: bash
        env:
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_RUN_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            sha="$DISPATCH_SOURCE_SHA"
          else
            sha="$WORKFLOW_RUN_SOURCE_SHA"
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid candidate SHA: $sha" >&2
            exit 1
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"

      - name: Verify matching green Core ISO and QA runs
        id: verify
        uses: actions/github-script@v7
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const sha = process.env.CANDIDATE_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function findSuccessfulRun(workflowFile, workflowName) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {owner, repo, workflow_id: workflowFile, per_page: 100}
              );
              const matches = runs.filter(r =>
                r.head_sha === sha && r.status === 'completed' && r.conclusion === 'success'
              );
              if (!matches.length) {
                core.setFailed(`${workflowName} has no successful run for ${sha}`);
                return null;
              }
              return matches.sort((a, b) => b.run_number - a.run_number)[0];
            }

            const coreRun = await findSuccessfulRun('core-iso-build.yml', 'Core ISO Build');
            const qaRun = await findSuccessfulRun('qa-qemu-smoke.yml', 'QA QEMU Boot Smoke');
            if (!coreRun || !qaRun) return;

            const coreArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: coreRun.id, per_page: 100}
            );
            const qaArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {owner, repo, run_id: qaRun.id, per_page: 100}
            );

            const isoArtifact = coreArtifacts.find(a => /iso/i.test(a.name) && !a.expired);
            if (!isoArtifact) {
              core.setFailed(`Core ISO run ${coreRun.id} has no live ISO artifact`);
              return;
            }

            const manifest = {
              schema: 1,
              candidate_sha: sha,
              qualified_at: new Date().toISOString(),
              policy: 'live-boot-only-until-destructive-installer-vm-gate-passes',
              core_iso: {
                run_id: coreRun.id,
                run_number: coreRun.run_number,
                html_url: coreRun.html_url,
                artifact_id: isoArtifact.id,
                artifact_name: isoArtifact.name,
                artifact_size_bytes: isoArtifact.size_in_bytes,
                artifact_digest: isoArtifact.digest || null,
                expires_at: isoArtifact.expires_at || null
              },
              qa_qemu: {
                run_id: qaRun.id,
                run_number: qaRun.run_number,
                html_url: qaRun.html_url,
                artifacts: qaArtifacts.filter(a => !a.expired).map(a => ({
                  id: a.id,
                  name: a.name,
                  size_bytes: a.size_in_bytes,
                  digest: a.digest || null,
                  expires_at: a.expires_at || null
                }))
              }
            };

            require('fs').writeFileSync('hardware-candidate.json', JSON.stringify(manifest, null, 2) + '\n');
            core.summary
              .addHeading('Xodus hardware candidate qualified')
              .addTable([
                [{data: 'Candidate', header: true}, sha],
                [{data: 'Core ISO run', header: true}, String(coreRun.run_number)],
                [{data: 'QA run', header: true}, String(qaRun.run_number)],
                [{data: 'ISO artifact', header: true}, isoArtifact.name],
                [{data: 'Policy', header: true}, manifest.policy]
              ])
              .write();

      - name: Upload qualification manifest
        uses: actions/upload-artifact@v4
        with:
          name: hardware-candidate-${{ steps.candidate.outputs.sha }}
          path: hardware-candidate.json
          retention-days: 14
          if-no-files-found: error
