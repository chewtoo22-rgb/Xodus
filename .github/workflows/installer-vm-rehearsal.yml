name: Installer VM Rehearsal

on:
  pull_request:
    paths:
      - 'qa/installer-vm-rehearsal.sh'
      - '.github/workflows/installer-vm-rehearsal.yml'
      - 'scripts/installer-target-guard.sh'
      - 'docs/INSTALLER_SAFETY.md'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional Core ISO source SHA; must match the selected ref'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  installer-rehearsal:
    runs-on: ubuntu-24.04
    # The matching PR ISO can take up to 180 minutes to build before this gate starts.
    timeout-minutes: 225
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact PR-head checkout
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"

      - name: Parse pinned pearOS revision
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          line=$(grep -v '^#' upstream/iso.lock | grep -v '^$' | head -n1)
          IFS='|' read -r repo branch commit captured <<< "$line"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Resolve proven Core ISO
        id: run
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}
          EXPECTED_ARTIFACT: xodus-reference-iso-${{ steps.lock.outputs.commit }}
        run: |
          set -euo pipefail

          checkout_sha=$(git rev-parse HEAD)
          target_sha="$checkout_sha"
          required_event=''
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            target_sha="$PR_HEAD_SHA"
            required_event='pull_request'
          elif [[ -n "$REQUESTED_SOURCE_SHA" && "$REQUESTED_SOURCE_SHA" != "$checkout_sha" ]]; then
            echo 'Requested Core ISO SHA must match the dispatched checkout' >&2
            exit 5
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid Core ISO source SHA' >&2; exit 5; }

          # A PR must use the ISO built from its exact head, even while that
          # producer is still running. Dispatch is bound to its selected ref.
          for attempt in $(seq 1 360); do
            uri="/repos/${GITHUB_REPOSITORY}/actions/workflows/core-iso-build.yml/runs?per_page=100"
            if [[ -n "$target_sha" ]]; then
              uri="${uri}&head_sha=${target_sha}"
            else
              uri="${uri}&status=success"
            fi
            runs=$(gh api -H 'Accept: application/vnd.github+json' "$uri")
            row=''
            while IFS=$'\t' read -r candidate_id candidate_sha; do
              [[ -n "$candidate_id" ]] || continue
              artifacts=$(gh api -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_id}/artifacts?per_page=100")
              if jq -e --arg name "$EXPECTED_ARTIFACT" \
                '[.artifacts[] | select(.name == $name)] as $matches |
                 ($matches | length) == 1 and
                 $matches[0].expired == false and
                 $matches[0].size_in_bytes > 0' <<< "$artifacts" >/dev/null; then
                row="${candidate_id}"$'\t'"${candidate_sha}"
                break
              fi
            done < <(jq -r --arg sha "$target_sha" --arg event "$required_event" \
              '.workflow_runs[] |
               select(.status == "completed" and .conclusion == "success" and
                      ($sha == "" or .head_sha == $sha) and
                      ($event == "" or .event == $event)) |
               [.id,.head_sha] | @tsv' <<< "$runs")

            if [[ -n "$row" ]]; then break; fi
            if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
              echo 'No successful Core ISO build with a live expected artifact matched the dispatch request' >&2
              exit 5
            fi
            active=$(jq -r --arg sha "$target_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "pull_request" and .status != "completed")] | length' \
              <<< "$runs")
            if (( active == 0 && attempt >= 4 )); then
              echo "No successful exact-head Core ISO run with live artifact for $target_sha" >&2
              exit 5
            fi
            echo "Waiting for exact-head Core ISO artifact for $target_sha (poll $attempt/360)"
            sleep 30
          done
          [[ -n "${row:-}" ]] || { echo 'Exact-head Core ISO artifact did not appear before timeout' >&2; exit 5; }
          IFS=$'\t' read -r run_id source_sha <<< "$row"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Using proven Core ISO run $run_id from $source_sha"

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Install VM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso file

      - name: Download proven ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: xodus-reference-iso-${{ steps.lock.outputs.commit }}
          path: installer-input
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run_id }}

      - name: Verify ISO checksum
        id: image
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t isos < <(find installer-input -type f -name '*.iso')
          mapfile -t checksums < <(find installer-input -type f -name 'xodus-reference.sha256')
          mapfile -t manifests < <(find installer-input -type f -name 'xodus-reference.manifest')
          (( ${#isos[@]} == 1 && ${#checksums[@]} == 1 && ${#manifests[@]} == 1 ))
          test -s "${isos[0]}" && test -s "${checksums[0]}" && test -s "${manifests[0]}"
          iso_abs=$(realpath "${isos[0]}")
          expected=$(awk 'NR == 1 {print $1}' "${checksums[0]}")
          actual=$(sha256sum "$iso_abs" | awk '{print $1}')
          [[ "$expected" == "$actual" ]]
          grep -Fxq 'xodus_source_commit=${{ steps.run.outputs.source_sha }}' "${manifests[0]}"
          grep -Fxq 'upstream_commit=${{ steps.lock.outputs.commit }}' "${manifests[0]}"
          grep -Fxq "iso_filename=$(basename "$iso_abs")" "${manifests[0]}"
          grep -Fxq "iso_sha256=$actual" "${manifests[0]}"
          echo "iso=$iso_abs" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\ncore_source_sha=%s\ncore_run_id=%s\n' "$actual" '${{ steps.run.outputs.source_sha }}' '${{ steps.run.outputs.run_id }}' | tee installer-image-digest.txt

      - name: Run installer topology rehearsal
        env:
          BOOT_SECONDS: 120
          DISK_GIB: 32
        run: |
          bash -n qa/installer-vm-rehearsal.sh
          bash qa/installer-vm-rehearsal.sh '${{ steps.image.outputs.iso }}' qa-installer-artifacts
          grep -Fq 'installer_invoked=no' qa-installer-artifacts/rehearsal-summary.txt

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xodus-installer-rehearsal-${{ steps.run.outputs.source_sha }}
          path: |
            qa-installer-artifacts/
            installer-image-digest.txt
          if-no-files-found: warn
          retention-days: 7
