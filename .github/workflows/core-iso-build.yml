name: Core ISO Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'upstream/iso.lock'
      - 'overlay/**'
      - '.github/workflows/core-iso-build.yml'
      - 'docs/core-iso.md'
      - 'docs/desktop-identity.md'
      - '.github/workflows/qa-qemu-smoke.yml'
      - '.github/workflows/hardware-candidate.yml'
      - 'qa/**'
  pull_request:
    paths:
      - 'upstream/iso.lock'
      - 'overlay/**'
      - '.github/workflows/core-iso-build.yml'
      - 'docs/core-iso.md'
      - 'docs/desktop-identity.md'

permissions:
  contents: read

concurrency:
  group: core-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-reference-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Xodus
        uses: actions/checkout@v4

      - name: Parse pinned pearOS source
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t entries < <(awk 'NF && $1 !~ /^#/ {print}' upstream/iso.lock)
          test "${#entries[@]}" -eq 1
          IFS='|' read -r repo branch commit captured extra <<< "${entries[0]}"
          test -n "$repo"
          test -n "$branch"
          test -n "$captured"
          test -z "${extra:-}"
          [[ "$captured" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$repo" =~ ^https://[^[:space:]]+$ ]]
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - name: Fetch exact pearOS revision
        shell: bash
        run: |
          set -euo pipefail
          git init pearos-iso
          cd pearos-iso
          git remote add origin '${{ steps.lock.outputs.repo }}'
          git fetch --depth=1 origin '${{ steps.lock.outputs.commit }}'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = '${{ steps.lock.outputs.commit }}'
          test -x build-binary
          test -f pear/efiboot/ploader/ploader_x64.efi
          test -f packages/pearos.gpg
          test -f packages/inled.gpg

      - name: Apply Xodus identity overlay
        shell: bash
        env:
          XODUS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          XODUS_UPSTREAM_COMMIT: ${{ steps.lock.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$XODUS_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          bash -n overlay/apply-xodus-identity.sh
          bash overlay/apply-xodus-identity.sh "$GITHUB_WORKSPACE/pearos-iso"
          grep -F 'iso_name="Xodus"' pearos-iso/pear/profiledef.sh
          grep -Fx "XODUS_SOURCE_COMMIT=$XODUS_SOURCE_COMMIT" pearos-iso/pear/airootfs/usr/lib/xodus/build-info
          grep -Fx 'XODUS_UPSTREAM_COMMIT=${{ steps.lock.outputs.commit }}' pearos-iso/pear/airootfs/usr/lib/xodus/build-info

      - name: Require build headroom
        shell: bash
        run: |
          set -euo pipefail
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          required_kb=$((20 * 1024 * 1024))
          echo "Available workspace storage: $((available_kb / 1024 / 1024)) GiB"
          if (( available_kb < required_kb )); then
            echo "Need at least 20 GiB free before starting the ISO build." >&2
            exit 1
          fi

      - name: Pull Arch build environment
        run: docker pull archlinux:base-devel

      - name: Build pinned Xodus reference ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged --network host \
            -v "$GITHUB_WORKSPACE/pearos-iso:/build" \
            -w /build \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm \
                arch-install-scripts mtools squashfs-tools xorriso e2fsprogs \
                git pv erofs-utils gnupg dosfstools syslinux

              # Reproduce pearOS upstream CI trust bootstrap. The ISO profile
              # consumes pearOS, inled, and CachyOS repositories, so a fresh
              # Arch container must trust all three before pacstrap runs.
              pacman-key --init
              pacman-key --populate archlinux
              pacman-key -a packages/pearos.gpg
              pacman-key --lsign-key 4C1A9F3C131ACA95
              pacman-key -a packages/inled.gpg
              pacman-key --lsign-key 89F828A9675B63CD0077CE9965AA57CF36E2018F

              awk '\''/^\[cachyos\]/{skip=1; next} /^\[/{skip=0} !skip'\'' pear/pacman.conf > /tmp/pacman-bootstrap.conf
              pacman -Sy --noconfirm --config /tmp/pacman-bootstrap.conf
              pacman -S --noconfirm --config /tmp/pacman-bootstrap.conf cachyos-keyring
              pacman-key --populate cachyos
              pacman -Sy --noconfirm --config pear/pacman.conf

              command -v pacstrap arch-chroot mksquashfs xorriso mkfs.ext4 tune2fs git pv

              # pearOS currently serves some profile packages from a single
              # upstream mirror. Retain pacman CacheDir across attempts so each
              # successful download shrinks the remaining mirror exposure.
              # Retry only explicit transport/server failures; deterministic
              # build/package errors still fail immediately.
              max_attempts=6
              attempt=1
              while :; do
                log="/build/xodus-build-attempt-${attempt}.log"
                echo "Xodus ISO build attempt ${attempt}/${max_attempts}"
                set +e
                ./build-binary --build --filename Xodus-reference --compression fastest --clean --sha256 2>&1 | tee "$log"
                status=${PIPESTATUS[0]}
                set -e

                if (( status == 0 )); then
                  break
                fi

                if (( attempt >= max_attempts )); then
                  echo "ISO build failed after ${attempt} attempts." >&2
                  exit "$status"
                fi

                if ! grep -Eqi "(HTTP[^[:digit:]]*(429|5[0-9]{2})|429 Too Many Requests|Too Many Requests|failed retrieving file|Exceeded the maximum allowed file size|operation too slow|timed out|timeout was reached|temporary failure|connection reset|connection refused|could not resolve host)" "$log"; then
                  echo "ISO build failed with a non-transient error; refusing retry." >&2
                  exit "$status"
                fi

                delay=$((attempt * 30))
                if (( delay > 120 )); then delay=120; fi
                echo "Transient package/mirror failure detected; cached packages retained; retrying in ${delay}s." >&2
                sleep "$delay"
                attempt=$((attempt + 1))
              done
            '

      - name: Verify produced image and write provenance manifest
        id: artifact
        shell: bash
        env:
          XODUS_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          XODUS_UPSTREAM_COMMIT: ${{ steps.lock.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$XODUS_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$XODUS_UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          iso=$(find pearos-iso -maxdepth 1 -type f -name 'Xodus-reference-*.iso' -print -quit)
          test -n "$iso"
          test -s "$iso"
          sha256sum "$iso" | tee pearos-iso/xodus-reference.sha256
          iso_sha=$(sha256sum "$iso" | awk '{print $1}')
          iso_name=$(basename "$iso")
          cat > pearos-iso/xodus-reference.manifest <<EOF
          schema=1
          xodus_source_commit=$XODUS_SOURCE_COMMIT
          upstream_commit=$XODUS_UPSTREAM_COMMIT
          iso_filename=$iso_name
          iso_sha256=$iso_sha
          EOF
          grep -Fx "xodus_source_commit=$XODUS_SOURCE_COMMIT" pearos-iso/xodus-reference.manifest
          grep -Fx "upstream_commit=$XODUS_UPSTREAM_COMMIT" pearos-iso/xodus-reference.manifest
          grep -Eq '^iso_sha256=[0-9a-f]{64}$' pearos-iso/xodus-reference.manifest
          printf 'iso=%s\n' "$iso" >> "$GITHUB_OUTPUT"
          ls -lh "$iso" pearos-iso/xodus-reference.sha256 pearos-iso/xodus-reference.manifest

      - name: Upload reference ISO
        uses: actions/upload-artifact@v4
        with:
          name: xodus-reference-iso-${{ steps.lock.outputs.commit }}
          path: |
            ${{ steps.artifact.outputs.iso }}
            pearos-iso/xodus-reference.sha256
            pearos-iso/xodus-reference.manifest
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Preserve failure diagnostics
        if: failure()
        shell: bash
        run: |
          df -h > disk-usage.txt || true
          find pearos-iso/work -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | tail -500 > build-files.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xodus-core-iso-failure-diagnostics
          path: |
            disk-usage.txt
            build-files.txt
            pearos-iso/xodus-build-attempt-*.log
          if-no-files-found: ignore
          retention-days: 7
