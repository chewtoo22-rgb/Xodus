name: Core ISO Diagnostics Contract

on:
  pull_request:
    paths:
      - '.github/workflows/core-iso-build.yml'
      - 'qa/check_core_iso_diagnostics.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-iso-build.yml'
      - 'qa/check_core_iso_diagnostics.py'

permissions:
  contents: read

jobs:
  core-iso-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Core ISO failure diagnostics
        run: python3 qa/check_core_iso_diagnostics.py
