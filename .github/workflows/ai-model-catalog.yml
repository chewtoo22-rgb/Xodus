name: AI Model Catalog

on:
  pull_request:
    paths:
      - 'config/xodus-ai-model-catalog.json'
      - 'scripts/xodus-ai-select.py'
      - 'scripts/xodus-ai-resolve-model.py'
      - 'qa/test-ai-model-catalog.py'
      - '.github/workflows/ai-model-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'config/xodus-ai-model-catalog.json'
      - 'scripts/xodus-ai-select.py'
      - 'scripts/xodus-ai-resolve-model.py'
      - 'qa/test-ai-model-catalog.py'
      - '.github/workflows/ai-model-catalog.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run selector tests
        run: python3 qa/test-ai-hardware-selector.py
      - name: Run catalog resolver tests
        run: python3 qa/test-ai-model-catalog.py
      - name: Smoke resolve 32 GiB Intel NUC class
        shell: bash
        run: |
          set -euo pipefail
          selector_json="$(mktemp)"
          python3 scripts/xodus-ai-select.py --ram-gib 32 --vram-gib 0 --gpu-vendor intel > "$selector_json"
          resolved="$(python3 scripts/xodus-ai-resolve-model.py --selector-json "$selector_json")"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d["tier"] == "standard"; assert d["backend"] == "vulkan"; assert d["model"]["family"] == "nemotron-nano"; assert d["download_requested"] is False' "$resolved"
