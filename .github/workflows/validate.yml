name: Validate Xodus

on:
  push:
    branches: [main, "m0/**", "work/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate upstream manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/pearos-repos.txt
          awk -F'|' '
            /^#/ || NF == 0 { next }
            NF != 3 { print "Invalid manifest line: " $0; exit 1 }
            $2 !~ /^https:\/\/github\.com\/pearOS-archlinux\// { print "Unexpected upstream: " $2; exit 1 }
          ' upstream/pearos-repos.txt

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(
            find scripts qa overlay -type f -print | sort | while IFS= read -r path; do
              case "$path" in
                *.sh) printf '%s\n' "$path" ;;
                *) head -n1 "$path" | grep -Eq '^#!.*\b(bash|sh)\b' && printf '%s\n' "$path" || true ;;
              esac
            done
          )
          test "${#scripts[@]}" -gt 0
          printf 'Checking %s\n' "${scripts[@]}"
          for script in "${scripts[@]}"; do bash -n "$script"; done

      - name: Shell syntax invocation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/check_shell_syntax_invocations.py
          python3 -m unittest qa/test_check_shell_syntax_invocations.py

      - name: Required architecture docs
        shell: bash
        run: |
          test -s docs/ARCHITECTURE.md
          test -s docs/ROADMAP.md

  upstream-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify upstream repositories are reachable
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r name url branch; do
            [[ -z "${name:-}" || "$name" == \#* ]] && continue
            echo "Checking $name ($branch)"
            git ls-remote --exit-code --heads "$url" "$branch" >/dev/null
          done < upstream/pearos-repos.txt
