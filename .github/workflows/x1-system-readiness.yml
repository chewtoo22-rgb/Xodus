name: X1 System Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'qa/x1-system-readiness.py'
      - 'qa/test_x1_system_readiness.py'
      - '.github/workflows/x1-system-readiness.yml'
  pull_request:
    paths:
      - 'qa/x1-system-readiness.py'
      - 'qa/test_x1_system_readiness.py'
      - '.github/workflows/x1-system-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile gate and tests
        run: python3 -m py_compile qa/x1-system-readiness.py qa/test_x1_system_readiness.py
      - name: Run regression suite
        run: python3 -m unittest qa/test_x1_system_readiness.py -v
      - name: Enforce read-only offline boundary
        shell: bash
        run: |
          set -euo pipefail
          gate=qa/x1-system-readiness.py
          if grep -nE '\b(curl|wget|requests|urllib|socket|subprocess|os\.system|mount|umount|mkfs|parted|sgdisk|fdisk|dd|reboot|shutdown|systemctl)[[:space:](]' "$gate"; then
            echo 'X1 system readiness gate contains a forbidden network/mutation primitive' >&2
            exit 1
          fi
          grep -q '"hardware_validation_claim": False' "$gate"
          grep -q '"physical_install_claim": "not_automatic"' "$gate"
          grep -q '"network_used": False' "$gate"
      - name: End-to-end ready fixture
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cat >"$tmp/local-ai.json" <<'JSON'
          {"schema":1,"status":"ready_for_nuc_local_ai_test","candidate_sha":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ai_tier":"standard","ai_backend":"cpu","engine":"/usr/bin/llama-server","network_used":false,"physical_install_claim":"not_automatic","hardware_validation_claim":false}
          JSON
          cat >"$tmp/desktop.txt" <<'EOF'
          schema=1
          hardware_validation_claim=false
          desktop_ready=true
          blockers=
          warnings=pipewire_not_detected
          EOF
          python3 qa/x1-system-readiness.py \
            --local-ai-readiness "$tmp/local-ai.json" \
            --desktop-preflight "$tmp/desktop.txt" \
            --output "$tmp/system-readiness.json"
          python3 - "$tmp/system-readiness.json" <<'PY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert result["status"] == "ready_for_x1_nuc_system_test"
          assert result["candidate_sha"] == "a" * 40
          assert result["desktop_ready"] is True
          assert result["hardware_validation_claim"] is False
          assert result["network_used"] is False
          PY
